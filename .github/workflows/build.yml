name: Build APK (v5)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar proyecto (usa el zip subido mas recientemente)
        id: loc
        run: |
          rm -rf _src && mkdir -p _src
          best=""; bestt=0
          for z in *.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z")
            t=${t:-0}
            echo "ZIP encontrado: $z (subido en $t)"
            if [ "$t" -gt "$bestt" ]; then best="$z"; bestt="$t"; fi
          done
          if [ -n "$best" ]; then
            echo "Usando el zip mas reciente: $best"
            unzip -q -o "$best" -d _src
          fi
          f=$(find _src -name settings.gradle.kts | head -n1)
          if [ -z "$f" ]; then
            f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          fi
          if [ -z "$f" ]; then
            echo "ERROR: no se encontro settings.gradle.kts. Archivos del repositorio:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "Proyecto en: $(dirname "$f")"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Copiar APK
        run: cp "${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Modelo3DStudio.apk

      - name: Publicar APK en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: Modelo3DStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Modelo3DStudio-debug
          path: Modelo3DStudio.apk
