on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "web/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-export
  cancel-in-progress: true
jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extraer el proyecto Android del ZIP
        run: |
          mkdir -p android
          if [ -f "Modelo3DStudio (9).zip" ]; then
            unzip -q -o "Modelo3DStudio (9).zip" -d _src
            root=$(find _src -name settings.gradle.kts -print -quit)
            if [ -z "$root" ]; then
              echo "No se encontró settings.gradle.kts dentro del ZIP"
              exit 1
            fi
            cp -a "$(dirname "$root")/." android/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Expose Android source project for development"
            git push
          else
            echo "El código fuente Android ya está actualizado"
          fi
